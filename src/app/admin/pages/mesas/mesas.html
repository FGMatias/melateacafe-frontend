<div class="page-container">
    <div class="page-header">
        <div class="header-content">
            <h1 class="page-title">Mesas</h1>
            <p class="page-subtitle">Gestión de la distribución del salón</p>
        </div>
        <div class="header-actions">
            <button pButton label="Nueva Mesa" icon="pi pi-plus"
                class="p-button-rounded bg-cafe-primary border-cafe-primary" (click)="openCreateDialog()">
            </button>
        </div>
    </div>

    <div class="filters-container mb-4">
        <p-iconfield iconPosition="left" class="w-full">
            <p-inputicon styleClass="pi pi-search" />
            <input type="text" pInputText placeholder="Buscar mesa..." class="w-full search-input"
                [(ngModel)]="searchValue" (input)="onGlobalFilter($event)" />
        </p-iconfield>

        <div class="filters-row mt-3 flex gap-3 flex-wrap">
            <p-select [options]="estadoOptions" [(ngModel)]="selectedEstado" optionLabel="label"
                placeholder="Filtrar por Estado" class="filter-dropdown" [showClear]="true"
                (onChange)="filterByEstado()">
            </p-select>

            <button pButton label="Limpiar filtros" icon="pi pi-filter-slash" class="p-button-outlined custom-clear-btn"
                (click)="clearFilters()">
            </button>
        </div>
    </div>

    <div class="table-container">
        <p-table #dt [value]="mesas" [loading]="loading" [paginator]="true" [rows]="10"
            [globalFilterFields]="['numeroMesa', 'descripcion']" [showCurrentPageReport]="true"
            responsiveLayout="scroll" currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} mesas">

            <ng-template pTemplate="header">
                <tr>
                    <th pSortableColumn="numeroMesa">Mesa <p-sortIcon field="numeroMesa"></p-sortIcon></th>
                    <th pSortableColumn="capacidad">Capacidad <p-sortIcon field="capacidad"></p-sortIcon></th>
                    <th pSortableColumn="descripcion">Ubicación</th>
                    <th pSortableColumn="estado">Estado</th>
                    <th style="width: 50px; text-align: center;"></th>
                </tr>
            </ng-template>

            <ng-template pTemplate="body" let-mesa>
                <tr>
                    <td>
                        <div class="flex items-center gap-3">
                            <div
                                class="w-10 h-10 rounded-full bg-orange-50 flex items-center justify-center border border-orange-100 text-cafe-primary">
                                <i class="pi pi-th-large text-lg"></i>
                            </div>
                            <div class="flex flex-col">
                                <span class="font-bold text-gray-800 text-base">Mesa {{ mesa.numeroMesa }}</span>
                                <span class="text-xs text-gray-400">ID: {{ mesa.idMesa }}</span>
                            </div>
                        </div>
                    </td>

                    <td>
                        <div
                            class="flex items-center gap-2 text-gray-600 bg-gray-50 px-3 py-1 rounded-lg border border-gray-100 w-fit">
                            <i class="pi pi-users text-cafe-primary text-sm"></i>
                            <span class="font-medium text-sm">{{ mesa.capacidad }} Personas</span>
                        </div>
                    </td>

                    <td>
                        <span class="text-gray-600 text-sm">{{ mesa.descripcion || 'Sin ubicación específica' }}</span>
                    </td>

                    <td>
                        <p-tag [value]="mesa.estado" [severity]="getSeverity(mesa.estado)"
                            styleClass="text-xs px-2 font-medium">
                        </p-tag>
                    </td>

                    <td style="text-align: center;">
                        <button pButton type="button" icon="pi pi-ellipsis-v"
                            class="p-button-text p-button-rounded p-button-plain action-menu-btn"
                            (click)="toggleMenu(menu, $event, mesa)">
                        </button>
                    </td>
                </tr>
            </ng-template>

            <ng-template pTemplate="emptymessage">
                <tr>
                    <td colspan="5" class="text-center p-6">
                        <div class="flex flex-col items-center justify-center text-gray-400">
                            <i class="pi pi-th-large text-4xl mb-2 opacity-50"></i>
                            <span>No se encontraron mesas.</span>
                        </div>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</div>

<p-menu #menu [model]="menuItems" [popup]="true" appendTo="body"></p-menu>

<p-dialog [(visible)]="showDialog" [modal]="true" [style]="{width: '100%', maxWidth: '450px'}"
    [header]="modalMode === 'create' ? 'Nueva Mesa' : 'Editar Mesa'" styleClass="custom-modal" [draggable]="false"
    [resizable]="false">

    <div class="dialog-content pt-4" [formGroup]="mesaForm">
        <div class="grid grid-cols-2 gap-4 mb-4">
            <div class="field">
                <label class="block text-sm font-medium text-gray-700 mb-1">N° de Mesa <span
                        class="text-red-500">*</span></label>
                <input pInputText formControlName="numeroMesa" class="w-full" placeholder="Ej: 10" />
            </div>
            <div class="field">
                <label class="block text-sm font-medium text-gray-700 mb-1">Capacidad <span
                        class="text-red-500">*</span></label>
                <p-inputNumber formControlName="capacidad" [showButtons]="true" buttonLayout="horizontal"
                    inputId="horizontal" spinnerMode="horizontal" [min]="1" [max]="20" incrementButtonIcon="pi pi-plus"
                    decrementButtonIcon="pi pi-minus" styleClass="w-full input-number-custom">
                </p-inputNumber>
            </div>
        </div>

        <div class="field mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Ubicación / Descripción</label>
            <input pInputText formControlName="descripcion" class="w-full" placeholder="Ej: Terraza" />
        </div>

        <div class="field">
            <label class="block text-sm font-medium text-gray-700 mb-1">Estado Inicial</label>
            <p-select formControlName="estado" [options]="estadoOptions" optionLabel="label" optionValue="value"
                styleClass="w-full"></p-select>
        </div>
    </div>

    <ng-template pTemplate="footer">
        <div class="flex justify-end gap-2 mt-4">
            <button pButton label="Cancelar" class="p-button-outlined p-button-secondary custom-cancel-btn"
                (click)="showDialog = false">
            </button>
            <button pButton [label]="modalMode === 'create' ? 'Guardar' : 'Actualizar'" icon="pi pi-check"
                class="bg-cafe-primary border-cafe-primary" (click)="saveMesa()" [loading]="submitting">
            </button>
        </div>
    </ng-template>
</p-dialog>
