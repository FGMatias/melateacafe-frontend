<div class="page-container">
    <div class="page-header">
        <div class="header-content">
            <h1 class="page-title">Trabajadores</h1>
            <p class="page-subtitle">Gestión de empleados y personal</p>
        </div>
        <div class="header-actions">
            <button pButton label="Nuevo Trabajador" icon="pi pi-plus"
                class="p-button-rounded bg-cafe-primary border-cafe-primary" (click)="openCreateDialog()">
            </button>
        </div>
    </div>

    <div class="filters-container mb-4">
        <p-iconfield iconPosition="left" class="w-full">
            <p-inputicon styleClass="pi pi-search" />
            <input type="text" pInputText placeholder="Buscar por nombre, email o DNI..." class="w-full search-input"
                (input)="dt.filterGlobal($any($event.target).value, 'contains')" />
        </p-iconfield>

        <div class="filters-row mt-3 flex gap-3 flex-wrap">
            <p-select [options]="cargos" optionLabel="nombre" placeholder="Todos los cargos"
                class="filter-dropdown"></p-select>

            <button pButton label="Limpiar filtros" icon="pi pi-filter-slash" class="p-button-outlined custom-clear-btn"
                (click)="dt.clear()">
            </button>
        </div>
    </div>

    <div class="table-container">
        <p-table #dt [value]="trabajadores" [loading]="loading" [paginator]="true" [rows]="10"
            [globalFilterFields]="['nombres', 'apellidoPaterno', 'email', 'numeroDocumento']"
            [showCurrentPageReport]="true" responsiveLayout="scroll"
            currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} trabajadores">

            <ng-template pTemplate="header">
                <tr>
                    <th pSortableColumn="nombres">Nombre <p-sortIcon field="nombres"></p-sortIcon></th>
                    <th pSortableColumn="email">Email <p-sortIcon field="email"></p-sortIcon></th>
                    <th pSortableColumn="telefono">Teléfono</th>
                    <th pSortableColumn="cargo.nombre">Cargo <p-sortIcon field="cargo.nombre"></p-sortIcon></th>
                    <th>Usuario</th>
                    <th>Estado</th>
                    <th style="width: 50px; text-align: center;"></th>
                </tr>
            </ng-template>

            <ng-template pTemplate="body" let-trabajador>
                <tr>
                    <td>
                        <div class="employee-info">
                            <p-avatar [label]="getInitials(trabajador)" size="normal" shape="circle"
                                [style]="{ 'background-color': '#6f4e37', 'color': '#ffffff', 'font-weight': 'bold' }">
                            </p-avatar>
                            <div class="employee-details">
                                <span class="employee-name">{{ getFullName(trabajador) }}</span>
                                <span class="employee-doc text-xs text-gray-500">DNI: {{ trabajador.numeroDocumento
                                    }}</span>
                            </div>
                        </div>
                    </td>
                    <td>{{ trabajador.email }}</td>
                    <td>{{ trabajador.telefono }}</td>
                    <td>
                        <p-tag [value]="trabajador.cargo.nombre" severity="info" styleClass="text-xs"></p-tag>
                    </td>
                    <td>
                        <div class="user-status">
                            <p-tag *ngIf="trabajador.tieneUsuario" value="Con Acceso" severity="success"
                                icon="pi pi-check-circle" styleClass="text-xs"></p-tag>
                            <p-tag *ngIf="!trabajador.tieneUsuario" value="Sin Acceso" severity="warn" icon="pi pi-lock"
                                styleClass="text-xs"></p-tag>
                        </div>
                    </td>
                    <td>
                        <p-tag [value]="trabajador.estado ? 'Activo' : 'Inactivo'"
                            [severity]="trabajador.estado ? 'success' : 'danger'" styleClass="text-xs">
                        </p-tag>
                    </td>
                    <td style="text-align: center;">
                        <button pButton type="button"
                            class="p-button-text p-button-rounded p-button-plain action-menu-btn"
                            icon="pi pi-ellipsis-v" (click)="toggleMenu(menu, $event, trabajador)">
                        </button>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</div>

<p-menu #menu [model]="menuItems" [popup]="true" appendTo="body"></p-menu>

<p-dialog [(visible)]="showTrabajadorDialog" [modal]="true" [style]="{width: '90%', maxWidth: '800px'}"
    [header]="modalMode === 'create' ? 'Nuevo Trabajador' : (modalMode === 'edit' ? 'Editar Trabajador' : 'Detalles del Trabajador')"
    [draggable]="false" [resizable]="false" styleClass="custom-modal">

    <div class="dialog-content pt-4" [formGroup]="trabajadorForm">

        <h3 class="text-cafe-dark font-serif font-bold text-lg mb-4 border-b border-gray-200 pb-2">
            Información Personal
        </h3>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="field">
                <label class="block text-sm font-medium text-gray-700 mb-1">Nombres <span
                        class="text-red-500">*</span></label>
                <input pInputText formControlName="nombres" class="w-full" placeholder="Ej: Juan Carlos" />
                <small *ngIf="trabajadorForm.get('nombres')?.invalid && trabajadorForm.get('nombres')?.touched"
                    class="text-red-500">Requerido</small>
            </div>

            <div class="field">
                <label class="block text-sm font-medium text-gray-700 mb-1">Apellido Paterno <span
                        class="text-red-500">*</span></label>
                <input pInputText formControlName="apellidoPaterno" class="w-full" placeholder="Ej: Pérez" />
            </div>

            <div class="field">
                <label class="block text-sm font-medium text-gray-700 mb-1">Apellido Materno</label>
                <input pInputText formControlName="apellidoMaterno" class="w-full" placeholder="Ej: Gómez" />
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <div class="field">
                <label class="block text-sm font-medium text-gray-700 mb-1">Documento de Identidad (DNI/CE) <span
                        class="text-red-500">*</span></label>
                <input pInputText formControlName="numeroDocumento" class="w-full" />
            </div>

            <div class="field" *ngIf="modalMode !== 'create'">
                <label class="block text-sm font-medium text-gray-700 mb-1">Estado</label>
                <p-select formControlName="estado"
                    [options]="[{label: 'Activo', value: true}, {label: 'Inactivo', value: false}]" optionLabel="label"
                    optionValue="value" styleClass="w-full"></p-select>
            </div>
        </div>

        <h3 class="text-cafe-dark font-serif font-bold text-lg mb-4 border-b border-gray-200 pb-2 mt-6">
            Datos de Contacto y Puesto
        </h3>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <div class="field">
                <label class="block text-sm font-medium text-gray-700 mb-1">Correo Electrónico <span
                        class="text-red-500">*</span></label>
                <input pInputText formControlName="email" class="w-full" placeholder="juan@melateacafe.com" />
            </div>

            <div class="field">
                <label class="block text-sm font-medium text-gray-700 mb-1">Teléfono / Celular <span
                        class="text-red-500">*</span></label>
                <input pInputText formControlName="telefono" class="w-full" placeholder="999 999 999" />
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="field">
                <label class="block text-sm font-medium text-gray-700 mb-1">Cargo <span
                        class="text-red-500">*</span></label>
                <p-select formControlName="idCargo" [options]="cargos" optionLabel="nombre" optionValue="idCargo"
                    placeholder="Seleccione un cargo" styleClass="w-full" appendTo="body"></p-select>
            </div>

            <div class="field">
                <label class="block text-sm font-medium text-gray-700 mb-1">Fecha de Contratación <span
                        class="text-red-500">*</span></label>
                <p-datepicker formControlName="fechaContratacion" [showIcon]="true" dateFormat="dd/mm/yy"
                    styleClass="w-full" appendTo="body"></p-datepicker>
            </div>
        </div>

    </div>

    <ng-template pTemplate="footer">
        <div class="flex justify-end gap-2 mt-4">
            <button pButton label="Cerrar" class="p-button-outlined p-button-secondary"
                style="background-color: white !important; color: #4b5563 !important; border-color: #d1d5db !important;"
                (click)="showTrabajadorDialog = false">
            </button>

            <button *ngIf="modalMode !== 'view'" pButton
                [label]="modalMode === 'create' ? 'Guardar Trabajador' : 'Actualizar'" icon="pi pi-check"
                (click)="saveTrabajador()" [loading]="submitting">
            </button>
        </div>
    </ng-template>
</p-dialog>
