<header class="topbar" [class.collapsed]="collapsed">
    <div class="topbar-left">
        <button pButton pRipple icon="pi pi-bars" class="p-button-text p-button-rounded menu-toggle"
            (click)="onToggleSidebar()"></button>

        <div class="page-title">
            <h2>Panel de Administración</h2>
        </div>
    </div>

    <div class="topbar-right">
        <div class="user-menu">
            <button pButton pRipple class="p-button-text user-button" (click)="menu.toggle($event)">
                <p-avatar [label]="getInitials()" styleClass="avatar-small" shape="circle"
                    [style]="{ 'background-color': '#6f4e37', 'color': '#ffffff' }"></p-avatar>
                <span class="user-name">{{ getFullName() }}</span>
                <i class="pi pi-angle-down"></i>
            </button>

            <p-menu #menu [model]="userMenuItems" [popup]="true" appendTo="body"></p-menu>
        </div>
    </div>
</header>
