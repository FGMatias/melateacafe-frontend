<header class="poseidon-topbar" [class.collapsed]="collapsed">
    <div class="topbar-left">
        <button class="menu-toggle" (click)="onToggleSidebar()" pTooltip="Toggle Menu" tooltipPosition="bottom">
            <i class="pi pi-bars"></i>
        </button>

        <div class="page-breadcrumb">
            <i class="pi pi-home breadcrumb-icon"></i>
            <span class="breadcrumb-separator">/</span>
            <span class="breadcrumb-text">Panel de Administración</span>
        </div>
    </div>

    <div class="topbar-right">
        <button pButton icon="pi pi-search" class="p-button-text p-button-rounded action-button" pTooltip="Buscar"
            tooltipPosition="bottom">
        </button>

        <button pButton icon="pi pi-bell" class="p-button-text p-button-rounded action-button" pTooltip="Notificaciones"
            tooltipPosition="bottom" [badge]="'3'" badgeClass="notification-badge">
        </button>

        <div class="topbar-divider"></div>

        <div class="user-menu">
            <button class="user-menu-button" (click)="menu.toggle($event)">
                <p-avatar [label]="getInitials()" size="normal" shape="circle"
                    [style]="{ 'background-color': '#6f4e37', 'color': '#ffffff' }">
                </p-avatar>
                <div class="user-info">
                    <span class="user-name">{{ getFullName() }}</span>
                    <span class="user-role">{{ getRoleName() }}</span>
                </div>
                <i class="pi pi-angle-down dropdown-icon"></i>
            </button>

            <p-menu #menu [model]="userMenuItems" [popup]="true" appendTo="body" styleClass="poseidon-menu"></p-menu>
        </div>
    </div>
</header>
